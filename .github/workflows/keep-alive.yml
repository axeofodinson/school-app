name: Supabase keep-alive

# Free projects pause after 7 idle days. One cheap REST read per week prevents it.
# Delete this file if Hassan doesn't want it.
on:
  schedule:
    - cron: "0 22 * * 3"   # Thursday 03:00 Pakistan time
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets missing"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/academic_years?select=id&limit=1")
          echo "HTTP $code"
          [ "$code" -lt 500 ] && [ "$code" -ne 000 ] || exit 1
