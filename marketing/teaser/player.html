<title>Al-Syed Teaser Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage that fits the chosen aspect ratio, controls docked under it. Dark-only, like the trailer. */
:root {
  --ink: #0b1220; --ink-2: #121c33; --line: #26355a;
  --text: #f4f1ea; --muted: #a3adc2; --emerald: #1f9d6b; --saffron: #f2a93b;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--ui); margin: 0; }
.wrap { height: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.frame { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 20px 60px -20px #000; background: var(--ink); }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--emerald); color: #fff; font-size: 16px; cursor: pointer; flex: none; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 88px; }
.scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--saffron); }
.seg { display: inline-flex; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--line); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 12px var(--ui); padding: 7px 11px; border-radius: 99px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.note b { color: var(--saffron); font-weight: 600; }
</style>

<div class="wrap">
  <div class="stage" id="stage"><div class="frame" id="frame"></div></div>
  <div class="bar">
    <button class="play" id="play" aria-label="Play">▶</button>
    <span class="time" id="time">0.0 / 38.0 s</span>
    <input class="scrub" id="scrub" type="range" min="0" max="38000" step="33" value="0" aria-label="Seek">
  </div>
  <div class="bar">
    <span class="seg" role="group" aria-label="Format">
      <button id="f-9x16" data-f="9x16" aria-pressed="true">9:16</button>
      <button id="f-16x9" data-f="16x9" aria-pressed="false">16:9</button>
      <button id="f-1x1" data-f="1x1" aria-pressed="false">1:1 loop</button>
    </span>
  </div>
  <p class="note">Same timeline as the MP4s, with the <b>Urdu lines Hassan approved</b> on 23 Nov 2026. Everything shown is planned, not live yet.</p>
</div>

<script>
(() => {
  const FORMATS = { "9x16": [9, 16], "16x9": [16, 9], "1x1": [1, 1] };
  const LOOP = [[0, 3.7], [31.8, 35.6]]; // matches teaser.js
  let fmt = "9x16", urdu = "placeholder", playing = false, t = 0, last = null, iframe = null, total = 38000;
  const $ = (id) => document.getElementById(id);
  const frame = $("frame"), stage = $("stage");

  function loopTotal() { return LOOP.reduce((s, [a, b]) => s + (b - a) * 1000, 0); }
  function mapTime(ms) { // 1:1 plays the stitched loop
    if (fmt !== "1x1") return ms;
    for (const [a, b] of LOOP) { const d = (b - a) * 1000; if (ms < d) return a * 1000 + ms; ms -= d; }
    return LOOP[LOOP.length - 1][1] * 1000;
  }
  function fit() {
    const [w, h] = FORMATS[fmt];
    const r = stage.getBoundingClientRect();
    const s = Math.min(r.width / w, r.height / h);
    frame.style.width = Math.floor(w * s) + "px";
    frame.style.height = Math.floor(h * s) + "px";
  }
  function load() {
    frame.innerHTML = "";
    iframe = document.createElement("iframe");
    iframe.title = "Teaser";
    iframe.src = "teaser.html#urdu=" + urdu;
    frame.appendChild(iframe);
  }
  function send() {
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ seek: mapTime(t) }, "*");
    $("time").textContent = (t / 1000).toFixed(1) + " / " + (total / 1000).toFixed(1) + " s";
    $("scrub").value = String(t);
  }
  function setTotal() { total = fmt === "1x1" ? loopTotal() : 38000; $("scrub").max = String(total); if (t > total) t = 0; }
  window.addEventListener("message", (e) => { if (e.data && e.data.teaserReady) send(); });
  function tick(now) {
    if (!playing) return;
    if (last !== null) { t += now - last; if (t >= total) t = 0; }
    last = now; send(); requestAnimationFrame(tick);
  }
  function setPlaying(p) {
    playing = p; last = null;
    $("play").textContent = p ? "❚❚" : "▶";
    $("play").setAttribute("aria-label", p ? "Pause" : "Play");
    if (p) requestAnimationFrame(tick);
  }
  $("play").addEventListener("click", () => setPlaying(!playing));
  $("scrub").addEventListener("input", (e) => { t = Number(e.target.value); send(); });
  document.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => {
    fmt = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    setTotal(); fit(); send();
  }));
  document.querySelectorAll("[data-u]").forEach((b) => b.addEventListener("click", () => {
    urdu = b.dataset.u;
    document.querySelectorAll("[data-u]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    load();
  }));
  window.addEventListener("resize", fit);
  fit(); load();
  setPlaying(!matchMedia("(prefers-reduced-motion: reduce)").matches);
})();
</script>
